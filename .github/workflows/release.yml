name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Production Release (Vite + PyInstaller + Portable ZIP)
        run: python scripts/build_release.py

      - name: Verify release output files
        shell: pwsh
        run: |
          Get-ChildItem -Path "dist-app"
          if (-not (Test-Path "dist-app/*.zip")) {
            throw "Portable ZIP release artifact not found!"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Release ${{ github.event.inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-app/*.zip
            dist-app/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
